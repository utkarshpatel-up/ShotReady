<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="referrer" content="no-referrer">
<title>ShotReady</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel-2: #262a31; --line: #343a44; --text: #e9ebef; --dim: #9aa1ad;
    --red: #ff5a52; --green: #34c46a; --yellow: #f2c14e; --pgm: #e5322d; --pvw: #1fa553; --blue: #4ea1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: 0 max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: max(10px, env(safe-area-inset-top)) 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: .01em; }
  .brand span { color: var(--green); }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--dim); white-space: nowrap; }
  .pill.ok { background: rgba(52,196,106,.16); color: var(--green); }
  .pill.bad { background: rgba(255,90,82,.16); color: var(--red); }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .live.on i { background: var(--green); }
  .sum { margin-top: 6px; font-size: 13px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sum .red { color: var(--red); font-weight: 700; }
  .sum .yellow { color: var(--yellow); font-weight: 700; }
  .controls { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--dim); border: 0; padding: 7px 11px; font: inherit; font-size: 13px; min-height: 34px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--text); color: #14161a; font-weight: 700; }
  main { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { main { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1100px) { main { grid-template-columns: 1fr 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card.pgm { border-color: var(--pgm); box-shadow: 0 0 0 1px var(--pgm); }
  .card.pvw { border-color: var(--pvw); box-shadow: 0 0 0 1px var(--pvw); }
  .card.empty { opacity: .55; }
  .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .head .label { font-size: 17px; font-weight: 800; }
  .head .body { color: var(--dim); font-size: 13px; }
  .head .tags { margin-left: auto; display: flex; gap: 4px; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; color: #fff; }
  .tag.pgm { background: var(--pgm); }
  .tag.pvw { background: var(--pvw); }
  .tag.spare { background: var(--panel-2); color: var(--dim); }
  .pic { position: relative; aspect-ratio: 16 / 9; background: #000; display: block; width: 100%; border: 0; padding: 0; cursor: zoom-in; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .pic .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; }
  .pic .focus { position: absolute; left: 8px; bottom: 8px; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.65); }
  .pic .focus.in { color: var(--green); }
  .pic .focus.out { color: var(--red); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 8px 10px 4px; }
  .f { background: var(--panel-2); border-radius: 6px; padding: 3px 7px; font-size: 13px; white-space: nowrap; }
  .f b { color: var(--dim); font-weight: 500; margin-right: 4px; font-size: 12px; }
  .f.bad { color: var(--red); font-weight: 700; background: rgba(255,90,82,.12); }
  .line { padding: 2px 10px; font-size: 13px; color: var(--dim); }
  .line .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 4px; vertical-align: 1px; }
  .checks { padding: 4px 10px 10px; font-size: 13px; }
  .checks .ok { color: var(--green); font-weight: 600; }
  .checks .red { color: var(--red); font-weight: 600; }
  .checks .yellow { color: var(--yellow); font-weight: 600; }
  .note { color: var(--dim); text-align: center; padding: 30px 10px; }
  /* One camera, large: tap a picture. Back, the X or a swipe closes it; arrows or a swipe move on. */
  .big { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; }
  .big[hidden] { display: none; }
  .big .bar { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 10px 8px; background: rgba(20,22,26,.92); }
  .big .bar .label { font-weight: 800; font-size: 17px; }
  .big .bar button { margin-left: auto; background: var(--panel-2); color: var(--text); border: 0; border-radius: 8px; font: inherit; font-size: 15px; min-width: 44px; min-height: 40px; }
  .big .bar button + button { margin-left: 4px; }
  .big .stage { flex: 1; position: relative; min-height: 0; }
  .big .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .big .facts { background: rgba(20,22,26,.92); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  @media (orientation: landscape) and (max-height: 500px) { .big .facts { display: none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Shot<span>Ready</span></div>
    <span class="pill" id="atem">ATEM</span>
    <div class="live" id="live"><i></i><span>Connecting…</span></div>
  </div>
  <div class="sum" id="sum"></div>
  <div class="controls">
    <div class="seg" id="show" role="group" aria-label="Which cameras">
      <button data-v="all">All</button><button data-v="air">On air</button>
    </div>
    <div class="seg" id="rate" role="group" aria-label="Picture rate">
      <button data-v="10">Smooth</button><button data-v="3">Data saver</button><button data-v="0">No pictures</button>
    </div>
  </div>
</header>
<main id="cams"><p class="note">Loading…</p></main>
<div class="big" id="big" hidden>
  <div class="bar"><span class="tag" id="big-tag"></span><span class="label" id="big-label"></span><span class="body" id="big-body"></span>
    <button id="big-prev" aria-label="Previous camera">‹</button><button id="big-next" aria-label="Next camera">›</button><button id="big-close" aria-label="Close">✕</button></div>
  <div class="stage" id="big-stage"><img id="big-img" alt=""></div>
  <div class="facts" id="big-facts"></div>
</div>
<script src="mobile.js"></script>
</body>
</html>
